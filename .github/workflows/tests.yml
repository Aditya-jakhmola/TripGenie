name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v
        env:
          # Dummy values so import-time config reads succeed.
          # The tests never call a real service.
          GROQ_API_KEY: test
          TAVILY_API_KEY: test
          OPENWEATHER_API_KEY: test
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          AUTH_SECRET_KEY: test-secret-for-ci